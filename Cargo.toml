[workspace]
resolver = "2"
members = [
    "apps/client",
    "crates/game_core",
    "crates/game_render",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
bevy = { version = "=0.20.1", features = ["wav"] }
game_core = { path = "crates/game_core" }
game_render = { path = "crates/game_render" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
